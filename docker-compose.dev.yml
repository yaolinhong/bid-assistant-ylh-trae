services:
  bid-assistant-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bid-assistant-dev
    ports:
      - "8800:8800"
      - "5678:5678"  # 调试端口
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DEBUG=1
      - RELOAD=1
    env_file:
      - .env
    volumes:
      # 完整项目目录挂载（实时同步）
      - ./:/app
      # 排除Python缓存目录
      - /app/__pycache__
    working_dir: /app
    # 开发模式启动命令（支持自动重载）
    command: [
      "sh", "-c", 
      "pip install -r requirements.txt && pip install watchdog && python hotreload.py"
    ]
    restart: unless-stopped
    networks:
      - bid-dev-network
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis开发环境
  redis-dev:
    image: redis:7-alpine
    container_name: bid-assistant-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - bid-dev-network
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis_dev_data:
    driver: local

networks:
  bid-dev-network:
    driver: bridge